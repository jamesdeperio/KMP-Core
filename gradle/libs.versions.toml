[versions]
# --- Build Configuration ---
androidCompileSdk = "37"
androidMinSdk = "30"
androidTargetSdk = "37"
agp = "9.1.1"
kotlin = "2.4.10"

# --- Jetpack Compose ---
composeMultiplatform = "1.12.2"
composeMaterial3 = "1.12.0-alpha03"
composeMaterialSymbols = "1.1.5"
compottie = "2.3.3"

# --- AndroidX ---
androidxActivity = "1.13.0"
androidxAppcompat = "1.8.0"
androidxCore = "1.19.1"
androidxCoreSplashScreen = "1.2.0"
androidxLifecycle = "2.11.0-beta01"
androidxWork = "2.11.2"
androidxSecurity = "1.1.0"
androidxBiometric = "1.1.0"

# --- KotlinX ---
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.12.0"
kotlinxDatetime = "0.8.0"

# --- Koin ---
koin = "4.2.2"

# --- Ktor ---
ktor = "3.6.1"
okhttp = "4.12.0"

# --- Navigation ---
navigation3 = "1.2.0"
navigation3Ui = "1.2.0"

# --- Security & Storage ---
cryptography = "0.6.0"
multiplatformSettings = "1.3.0"
sqlite = "2.7.1"
room = "2.8.5"
ksp = "2.1.0-1.0.29"
okio = "3.18.2"
coil = "3.6.3"

# --- Tools ---
spotless = "8.9.0"
detekt = "1.23.8"
ktlint = "1.3.1"
paparazzi = "2.0.0-alpha05"
buildkonfig = "0.22.0"
# --- Testing ---
junit = "4.13.2"
androidxTestExt = "1.3.0"
androidxTestRunner = "1.5.2"
androidxTestCore = "1.5.0"
androidxEspresso = "3.7.0"
exifinterface = "1.3.6"

[libraries]
# --- Kotlin ---
kotlinStdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
kotlinTest = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinTestJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }

# --- KotlinX ---
kotlinxCoroutinesCore = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinxCoroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinxSerializationCore = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerialization" }
kotlinxSerializationJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinxDatetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }

# --- AndroidX ---
androidxCoreKtx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidxCoreSplashScreen = { module = "androidx.core:core-splashscreen", version.ref = "androidxCoreSplashScreen" }
androidxAppcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidxActivityCompose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidxLifecycleViewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidxLifecycleRuntimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidxWorkRuntimeKtx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "androidxWork" }
androidxSecurityCrypto = { module = "androidx.security:security-crypto", version.ref = "androidxSecurity" }
androidxBiometric = { module = "androidx.biometric:biometric", version.ref = "androidxBiometric" }
androidxLifecycleProcess = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidxLifecycle" }
androidxNavigation3Runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidxNavigation3Ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3Ui" }

# --- Jetpack Compose (Multiplatform) ---
composeRuntime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
composeFoundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
composeUi = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
composeMaterial3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
composeComponentsResources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
composeUiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
composeUiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
composeMaterialSymbols = { module = "dev.vicart:compose-material-symbols", version.ref = "composeMaterialSymbols" }
compottie = { module = "io.github.alexzhirkevich:compottie", version.ref = "compottie" }
maplibre-compose = { module = "org.maplibre.compose:maplibre-compose", version = "0.14.0" }

# --- Koin ---
koinBom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koinCore = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koinAndroid = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koinCompose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koinComposeViewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }
koinComposeNavigation3 = { module = "io.insert-koin:koin-compose-navigation3" }

# --- Ktor ---
ktorClientCore = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktorClientOkhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktorClientAndroid = { module = "io.ktor:ktor-client-android", version.ref = "ktor" }
ktorClientDarwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktorClientContentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktorClientLogging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktorClientAuth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
ktorClientMock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktorSerializationKotlinxJson = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

# --- Security & Storage ---
cryptographyCore = { module = "dev.whyoleg.cryptography:cryptography-core", version.ref = "cryptography" }
cryptographyProviderOptimal = { module = "dev.whyoleg.cryptography:cryptography-provider-optimal", version.ref = "cryptography" }
multiplatformSettings = { module = "com.russhwolf:multiplatform-settings", version.ref = "multiplatformSettings" }
multiplatformSettingsCoroutines = { module = "com.russhwolf:multiplatform-settings-coroutines", version.ref = "multiplatformSettings" }
multiplatformSettingsSerialization = { module = "com.russhwolf:multiplatform-settings-serialization", version.ref = "multiplatformSettings" }
multiplatformSettingsNoArg = { module = "com.russhwolf:multiplatform-settings-no-arg", version.ref = "multiplatformSettings" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
coilCompose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coilNetwork = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }

roomRuntime = { module = "androidx.room:room-runtime", version.ref = "room" }
roomCompiler = { module = "androidx.room:room-compiler", version.ref = "room" }
sqliteBundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

# --- Testing ---
junit = { module = "junit:junit", version.ref = "junit" }
androidxTestExtJunit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidxTestRunner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidxTestCore = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidxEspressoCore = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxEspresso" }
exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }

[bundles]
composeBundle = [
    "composeRuntime",
    "composeFoundation",
    "composeMaterial3",
    "composeUi",
    "composeComponentsResources",
    "androidxLifecycleViewmodelCompose",
    "androidxLifecycleRuntimeCompose"
]
koinBundle = [
    "koinCore",
    "koinCompose",
    "koinComposeViewmodel",
    "koinComposeNavigation3"
]
ktorBundle = [
    "ktorClientCore",
    "ktorClientContentNegotiation",
    "ktorSerializationKotlinxJson",
    "ktorClientLogging",
    "ktorClientAuth"
]
testBundle = [
    "kotlinTest",
    "kotlinxCoroutinesTest"
]

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
androidLint = { id = "com.android.lint", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
buildkonfig = { id = "com.codingfeline.buildkonfig", version.ref = "buildkonfig" }
paparazzi = { id = "app.cash.paparazzi", version.ref = "paparazzi" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
